# Pytest configuration for OTForge's Python container sources.
#
# The application itself is TypeScript and covered by Vitest (npm test). This
# suite covers the Python that runs inside device containers, starting with the
# process simulator, whose determinism guarantees the evaluation work depends on.
#
# Run from the repository root:
#   pip install -r containers/process-sim/requirements-dev.txt
#   pytest
#
# testpaths is a list, so additional container suites are added by appending a
# directory here rather than by changing the CI job.

[pytest]
testpaths =
    containers/process-sim/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --strict-markers
